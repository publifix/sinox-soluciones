<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SINOX Soluciones</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --accent: #1fd1c1;
      --text: #f5f7f8;
      --muted: #8b98a3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    img {
      max-width: min(320px, 80vw);
      height: auto;
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      margin: 0;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      max-width: 32rem;
    }
    .badge {
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <img src="SINOX%20LOGO%20-%20ACENTO%20TURQUESA%20-%20BLANCO.png" alt="SINOX Soluciones" />
  <span class="badge">Sitio en construcción</span>
  <h1>SINOX Soluciones</h1>
  <p>Estamos construyendo el sitio corporativo. Este despliegue automático confirma que el pipeline de GitHub Pages está funcionando correctamente.</p>
</body>
</html>
